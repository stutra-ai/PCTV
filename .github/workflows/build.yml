name: Build

concurrency:
  group: "build"
  cancel-in-progress: true

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - '*.md'
      - 'repo.json'
      - 'DomainCheck.py'
  workflow_dispatch:    

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches all branches so Git knows exactly where 'builds' is

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Build and Push Plugins Directly
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Build the source code
          chmod +x gradlew
          ./gradlew make makePluginsJson --no-build-cache --rerun-tasks
          
          # 2. Back up our compiled files safely into the runner RAM temporary space
          mkdir -p /tmp/artifacts
          find . -name "plugins.json" -exec cp {} /tmp/artifacts/ \;
          find . -name "*.cs3" -exec cp {} /tmp/artifacts/ \;
          
          echo "==== Verified Compiled Files ===="
          ls -la /tmp/artifacts/
          
          # 3. Configure Git Identity
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          
          # 4. Force switch local runner to the builds branch layout cleanly
          if git fetch origin builds --depth=1; then
            git checkout -B builds origin/builds
          else
            git checkout --orphan builds
            git rm -rf . || true
          fi
          
          # 5. Bring our backed up compilation files into the root branch directory
          cp /tmp/artifacts/* .
          
          # 6. Force add and sync straight up to your GitHub repository
          git add plugins.json *.cs3
          git commit -m "Automated build update: $GITHUB_SHA" --allow-empty
          
          # Set explicit remote auth to bypass deployment permission blocks
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          git push origin builds --force
