name: Build

concurrency:
  group: "build"
  cancel-in-progress: true

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - '*.md'
      - 'repo.json'
      - 'DomainCheck.py'
  workflow_dispatch:    

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          path: "src"

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Build Plugins
        run: |
          cd $GITHUB_WORKSPACE/src
          chmod +x gradlew
          ./gradlew make makePluginsJson --no-build-cache --rerun-tasks
          
          # Create an isolated clean folder for staging output artifacts
          mkdir -p $GITHUB_WORKSPACE/output_builds
          
          echo "==== Hunting for Compiled Extension Assets ===="
          find . -name "plugins.json" -exec cp {} $GITHUB_WORKSPACE/output_builds/ \;
          find . -name "*.cs3" -exec cp {} $GITHUB_WORKSPACE/output_builds/ \;
          find . -name "*release*.apk" -exec cp {} $GITHUB_WORKSPACE/output_builds/ \;
          find . -name "*debug*.apk" -exec cp {} $GITHUB_WORKSPACE/output_builds/ \;
          
          cd $GITHUB_WORKSPACE/output_builds
          for f in *.apk; do
              [ -f "$f" ] && mv "$f" "${f%.apk}.cs3"
          done
          
          echo "Staging items verified:"
          ls -la $GITHUB_WORKSPACE/output_builds/

      - name: Deploy to builds branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          # FIXED: Instructs the deployer action to reference your actual git directory root
          workspace: src                  
          folder: ../output_builds       # Points to the staging folder relative to the new workspace root
          branch: builds
          token: ${{ secrets.GITHUB_TOKEN }}
          clean: false
