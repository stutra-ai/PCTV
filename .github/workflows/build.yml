name: Build

concurrency:
  group: "build"
  cancel-in-progress: true

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - '*.md'
      - 'repo.json'
      - 'DomainCheck.py'
  workflow_dispatch:    

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          path: "src"

      - name: Prepare builds folder
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p $GITHUB_WORKSPACE/builds
          cd $GITHUB_WORKSPACE/builds
          git init
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          
          if git fetch origin builds --depth=1; then
            git checkout builds
          else
            echo "Branch 'builds' not found. Seeding initial environment..."
            git checkout --orphan builds
            git rm -rf . || true
            # FORCE SEED: Create a dummy tracking file so git has a baseline to push
            echo "Initial Build Sync Placeholder" > .init_seed
          fi

      - name: Clean old builds
        run: rm -f $GITHUB_WORKSPACE/builds/*.cs3

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Build Plugins
        run: |
          cd $GITHUB_WORKSPACE/src
          chmod +x gradlew
          ./gradlew make makePluginsJson --no-build-cache --rerun-tasks
          
          # Universal directory mapping safety fallbacks
          cp -r build/plugins.json $GITHUB_WORKSPACE/builds/ || cp -r **/build/plugins.json $GITHUB_WORKSPACE/builds/ || true
          find . -name "*.cs3" -exec cp {} $GITHUB_WORKSPACE/builds/ \; || true

      - name: Push builds
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd $GITHUB_WORKSPACE/builds
          
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          
          # Force add tracking variables globally across the root tree 
          git add -A
          
          # Explicit execution path forces pushing even if staging encounters empty tracking parameters
          git commit -m "Build update: $GITHUB_SHA" --allow-empty
          
          git push origin builds --force
