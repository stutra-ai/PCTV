name: Build

concurrency:
  group: "build"
  cancel-in-progress: true

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - '*.md'
      - 'repo.json'
      - 'DomainCheck.py'
  workflow_dispatch:    

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          path: "src"

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Build Plugins
        run: |
          cd $GITHUB_WORKSPACE/src
          chmod +x gradlew
          ./gradlew make makePluginsJson --no-build-cache --rerun-tasks
          
          # Create a separate, isolated folder for staging
          mkdir -p $GITHUB_WORKSPACE/output_builds
          
          echo "==== Hunting for Compiled Extension Assets ===="
          # Safely copy plugins.json from wherever it was generated
          find . -name "plugins.json" -exec cp {} $GITHUB_WORKSPACE/output_builds/ \;
          
          # Grab extension files (.cs3) or raw app binaries (.apk)
          find . -name "*.cs3" -exec cp {} $GITHUB_WORKSPACE/output_builds/ \;
          find . -name "*release*.apk" -exec cp {} $GITHUB_WORKSPACE/output_builds/ \;
          find . -name "*debug*.apk" -exec cp {} $GITHUB_WORKSPACE/output_builds/ \;
          
          # If any outputs came out as .apk, rename them to .cs3 format seamlessly
          cd $GITHUB_WORKSPACE/output_builds
          for f in *.apk; do
              [ -f "$f" ] && mv "$f" "${f%.apk}.cs3"
          done
          
          echo "Staging items verified:"
          ls -la $GITHUB_WORKSPACE/output_builds/

      - name: Push builds branch
        uses: s0r00t/git-publish-subdir-action@v1.6.0
        env:
          REPO: self
          BRANCH: builds               # The target deployment branch
          FOLDER: output_builds        # The directory containing the built extension files
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MESSAGE: "Build update: {sha}"
