name: Build

concurrency:
  group: "build"
  cancel-in-progress: true

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - '*.md'
      - 'repo.json'
      - 'DomainCheck.py'
  workflow_dispatch:    

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Build Plugins
        run: |
          chmod +x gradlew
          ./gradlew make makePluginsJson --no-build-cache --rerun-tasks
          
          # Create the isolated output folder
          mkdir -p $GITHUB_WORKSPACE/output_builds
          
          echo "==== Hard Copying Compiled Extension Assets ===="
          
          # Direct hard copies from known gradle output targets
          cp build/plugins.json $GITHUB_WORKSPACE/output_builds/ || cp PinayCum/build/plugins.json $GITHUB_WORKSPACE/output_builds/ || true
          cp PinayCum/build/*.cs3 $GITHUB_WORKSPACE/output_builds/ || cp build/*.cs3 $GITHUB_WORKSPACE/output_builds/ || true
          
          # Universal search backup rule just in case paths change
          find . -name "plugins.json" -exec cp {} $GITHUB_WORKSPACE/output_builds/ \;
          find . -name "*.cs3" -exec cp {} $GITHUB_WORKSPACE/output_builds/ \;
          
          echo "Staging items verified:"
          ls -la $GITHUB_WORKSPACE/output_builds/

      - name: Deploy to builds branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: output_builds
          branch: builds
          token: ${{ secrets.GITHUB_TOKEN }}
          clean: false
